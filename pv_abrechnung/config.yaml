# Home-Assistant-Add-on-Manifest
name: PV Abrechnung
version: "0.2.0"
slug: pv_abrechnung
description: Zählerbasierte PV-Abrechnung (Anfangs-/Endstand) mit Tages-/Monats-/Jahresbericht per Mail
url: "https://github.com/matnig/ha-pv-abrechnung"
arch:
  - amd64
  - aarch64
  - armv7
init: false
# Web-UI in der HA-Seitenleiste (Ingress)
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_title: PV Abrechnung
# Zugriff auf die HA-Core-API (States + Recorder-Statistics) via Supervisor-Proxy
homeassistant_api: true
# Einfache Add-on-Optionen (Rest wird über die Web-UI konfiguriert und in /data abgelegt)
options:
  poll_interval_minutes: 10
schema:
  poll_interval_minutes: int(1,)
